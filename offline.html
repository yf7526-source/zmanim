<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolarZmanim — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, #0f2035 0%, #0D1B2A 50%, #080e17 100%);
      color: #f5e9c8;
      font-family: 'Inter', system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 400px;
      padding: 2.5rem;
      border-radius: 1.5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; color: #d4a84b; }
    p { font-size: 0.95rem; line-height: 1.6; opacity: 0.7; margin: 0 0 1.5rem; }
    button {
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(212,168,75,0.4);
      background: rgba(212,168,75,0.15);
      color: #d4a84b;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: rgba(212,168,75,0.25); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">☀️</div>
    <h1>You're Offline</h1>
    <p>SolarZmanim needs an internet connection to fetch live zmanim data. Please check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
